<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal do Aluno — Simulação</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

.pda-root {
  --void: #0e1c16;
  --board: #17291f;
  --board-2: #1e3327;
  --panel: #223a2c;
  --panel-2: #294534;
  --line: #375243;
  --chalk: #f3efe2;
  --chalk-dim: #a9baac;
  --chalk-faint: #7c8f80;
  --gold: #d9a441;
  --gold-dim: #8a7038;
  --teal: #5fa88f;
  --brick: #b5654a;
  font-family: 'Work Sans', sans-serif;
  background: var(--void);
  color: var(--chalk);
  min-height: 100vh;
  width: 100%;
  position: relative;
}

.pda-hand {
  font-family: 'Caveat', cursive;
}

.pda-mono {
  font-family: 'JetBrains Mono', monospace;
}

/* ---------- LOGIN ---------- */

.pda-login {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.pda-board-hero {
  position: relative;
  flex: 1 1 60%;
  min-height: 420px;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.04), transparent 45%),
    radial-gradient(ellipse at 60% 30%, rgba(255,255,255,0.03), transparent 35%),
    linear-gradient(160deg, var(--board-2) 0%, var(--board) 55%, #122019 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 32px;
  border-bottom: 6px solid #0b1610;
  box-shadow: inset 0 -40px 60px -40px rgba(0,0,0,0.6);
}

.pda-board-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.012) 0px,
    rgba(255,255,255,0.012) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

.pda-hand-illustration {
  width: 92px;
  height: auto;
  opacity: 0.9;
  margin-bottom: 6px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}

.pda-chalk-line-1 {
  font-size: clamp(2.4rem, 8vw, 4.2rem);
  line-height: 1;
  letter-spacing: 0.5px;
  color: var(--chalk);
  text-shadow: 0 0 1px rgba(255,255,255,0.5), 0 0 18px rgba(255,255,255,0.08);
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid var(--chalk);
  width: 0ch;
  animation: pda-write-1 1.6s steps(16, end) 0.4s forwards;
}

.pda-chalk-line-2 {
  font-size: clamp(1.1rem, 3.6vw, 1.5rem);
  color: var(--chalk-dim);
  margin-top: 10px;
  white-space: nowrap;
  overflow: hidden;
  width: 0ch;
  border-right: 2px solid var(--chalk-dim);
  opacity: 0;
  animation: pda-write-2 1.4s steps(28, end) 2.1s forwards;
}

@keyframes pda-write-1 {
  0% { width: 0ch; }
  100% { width: 16ch; border-right-color: transparent; }
}
@keyframes pda-write-2 {
  0% { width: 0ch; opacity: 1; }
  1% { opacity: 1; }
  99% { opacity: 1; }
  100% { width: 28ch; opacity: 1; border-right-color: transparent; }
}

.pda-board-tag {
  margin-top: 22px;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  animation: pda-fade-in 0.6s ease 3.2s forwards;
}

@keyframes pda-fade-in {
  to { opacity: 1; }
}

.pda-board-hero-photo {
  padding: 0;
  align-items: stretch;
  justify-content: stretch;
  flex: none;
  min-height: 0;
  aspect-ratio: 1430 / 1100;
  border-bottom: 6px solid #0b1610;
}
.pda-board-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 38%;
  display: block;
}

.pda-photo-strip-wrap {
  flex: 0 0 auto;
  background: var(--panel);
  padding: 20px 20px 28px;
  border-bottom: 1px solid var(--line);
}

.pda-photo-strip-label {
  font-size: 0.68rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  text-align: center;
}

.pda-photo-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.pda-photo-tile {
  flex: 0 0 auto;
  width: 74px;
  height: 74px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--chalk-faint);
  border: 1px dashed var(--line);
}

.pda-roles {
  padding: 22px 20px 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 420px;
  margin: 0 auto;
  width: 100%;
}

.pda-role-btn {
  position: relative;
  background: var(--board-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 0.88rem;
  padding: 12px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
}

.pda-role-btn span {
  text-align: center;
}

.pda-role-btn svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.6;
}

.pda-role-btn:hover {
  border-color: var(--gold);
  background: var(--panel-2);
  transform: translateY(-1px);
}

.pda-role-btn small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
  font-size: 0.66rem;
  color: var(--chalk-faint);
  margin-top: 2px;
}

/* ---------- FORM (Aluno / Encarregado) ---------- */

.pda-form-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(217,164,65,0.05), transparent 45%),
    var(--void);
}

.pda-form-card {
  width: 100%;
  max-width: 420px;
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 30px 26px 26px;
}

.pda-form-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.pda-form-title {
  font-family: 'Caveat', cursive;
  font-size: 2.1rem;
  color: var(--chalk);
  margin-bottom: 4px;
}

.pda-form-sub {
  color: var(--chalk-dim);
  font-size: 0.86rem;
  margin-bottom: 22px;
}

.pda-field {
  margin-bottom: 14px;
}

.pda-field label {
  display: block;
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  margin-bottom: 6px;
}

.pda-field input, .pda-field select, .pda-field textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  color: var(--chalk);
  font-size: 0.92rem;
  font-family: 'Work Sans', sans-serif;
  outline: none;
  transition: border-color 0.15s ease;
}

.pda-field textarea { resize: vertical; min-height: 74px; }

.pda-field input:focus, .pda-field select:focus, .pda-field textarea:focus {
  border-color: var(--gold);
}

.pda-team-link {
  text-align: center;
  margin-top: 4px;
}
.pda-team-link button {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.pda-team-link button:hover { color: var(--teal); }

.pda-manage-form {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.pda-manage-form input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 0.86rem;
}
.pda-manage-form button {
  background: var(--gold);
  border: none;
  color: #1b1607;
  font-weight: 700;
  font-size: 0.8rem;
  padding: 0 16px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}
.pda-remove-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
}
.pda-remove-btn:hover { color: var(--brick); background: var(--panel); }

.pda-publish-form {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 18px;
}
.pda-publish-form input, .pda-publish-form textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 0.86rem;
  margin-bottom: 8px;
  font-family: 'Work Sans', sans-serif;
}
.pda-publish-form button {
  background: var(--gold);
  border: none;
  color: #1b1607;
  font-weight: 700;
  font-size: 0.82rem;
  padding: 9px 16px;
  border-radius: 9px;
  cursor: pointer;
}
.pda-empty-note {
  color: var(--chalk-faint);
  font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  padding: 18px 0;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

.pda-primary-btn {
  width: 100%;
  background: var(--gold);
  color: #1b1607;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  margin-top: 6px;
  transition: filter 0.15s ease;
}
.pda-primary-btn:hover { filter: brightness(1.08); }

.pda-link-row {
  text-align: center;
  margin-top: 16px;
  font-size: 0.82rem;
  color: var(--chalk-dim);
}
.pda-link-row button {
  background: none;
  border: none;
  color: var(--teal);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.82rem;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.pda-back-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  cursor: pointer;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pda-back-btn:hover { color: var(--chalk); }

.pda-hint-box {
  margin-top: 16px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.76rem;
  color: var(--chalk-faint);
  line-height: 1.5;
}

/* ---------- VISITOR CHOICE ---------- */

.pda-visitor-choice {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pda-choice-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--chalk);
  padding: 13px 14px;
  text-align: left;
  cursor: pointer;
  font-size: 0.88rem;
}
.pda-choice-btn:hover { border-color: var(--teal); }

/* ---------- APP SHELL ---------- */

.pda-app {
  min-height: 100vh;
  background: var(--void);
  display: flex;
  flex-direction: column;
}

.pda-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(14,28,22,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

.pda-topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pda-icon-btn {
  background: none;
  border: none;
  color: var(--chalk);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 8px;
}
.pda-icon-btn:hover { background: var(--panel); }

.pda-brand {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--chalk);
}

.pda-role-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 3px 9px;
}

.pda-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--teal);
  color: #06120d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.8rem;
  font-family: 'Work Sans', sans-serif;
}

/* Drawer */

.pda-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.pda-drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.pda-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 280px;
  background: var(--board);
  border-right: 1px solid var(--line);
  z-index: 31;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}
.pda-drawer.open {
  transform: translateX(0);
}

.pda-drawer-header {
  padding: 4px 20px 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.pda-drawer-header .pda-hand {
  font-size: 1.7rem;
  color: var(--gold);
}
.pda-drawer-header p {
  font-size: 0.72rem;
  color: var(--chalk-faint);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

.pda-drawer-list {
  list-style: none;
  margin: 0;
  padding: 0 10px;
  overflow-y: auto;
  flex: 1;
}

.pda-drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: none;
  border: none;
  color: var(--chalk-dim);
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 0.88rem;
  cursor: pointer;
  text-align: left;
  margin-bottom: 2px;
}
.pda-drawer-item:hover {
  background: var(--panel);
  color: var(--chalk);
}
.pda-drawer-item.active {
  background: var(--panel-2);
  color: var(--gold);
  border-left: 2px solid var(--gold);
}

.pda-drawer-footer {
  padding: 10px 10px 4px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}

/* Main content */

.pda-main {
  flex: 1;
  padding: 18px 16px 60px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* Feed */

.pda-flyer {
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  background: linear-gradient(135deg, var(--board-2), var(--panel-2));
  border: 1px solid var(--line);
  padding: 22px 20px;
  position: relative;
}
.pda-flyer-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.64rem;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.pda-flyer h2 {
  font-family: 'Caveat', cursive;
  font-size: 2rem;
  margin: 4px 0 2px;
  color: var(--chalk);
}
.pda-flyer p {
  color: var(--chalk-dim);
  font-size: 0.85rem;
}
.pda-flyer button {
  margin-top: 12px;
  background: var(--gold);
  border: none;
  color: #1b1607;
  font-weight: 700;
  font-size: 0.8rem;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.pda-post {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.pda-post-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.pda-post-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  flex-shrink: 0;
}
.pda-post-meta strong {
  display: block;
  font-size: 0.88rem;
  color: var(--chalk);
}
.pda-post-meta span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  color: var(--chalk-faint);
}
.pda-post-tag {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  color: var(--teal);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pda-post-body {
  color: var(--chalk-dim);
  font-size: 0.87rem;
  line-height: 1.55;
  margin-bottom: 12px;
}
.pda-post-actions {
  display: flex;
  gap: 18px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.pda-post-action {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-size: 0.78rem;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.pda-post-action.liked { color: var(--brick); }
.pda-post-action:hover { color: var(--chalk); }

/* Module placeholder */

.pda-module-head {
  margin-bottom: 20px;
}
.pda-module-head .pda-hand {
  font-size: 2.1rem;
  color: var(--chalk);
}
.pda-module-head p {
  color: var(--chalk-dim);
  font-size: 0.88rem;
  margin-top: 4px;
  max-width: 46ch;
}

.pda-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 22px 0 10px;
}

.pda-card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.pda-book-card, .pda-video-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pda-book-cover {
  height: 96px;
  background: linear-gradient(135deg, var(--panel-2), var(--board-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--chalk-faint);
}
.pda-video-thumb {
  height: 88px;
  background: linear-gradient(135deg, var(--panel-2), var(--board-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  position: relative;
}
.pda-book-info, .pda-video-info {
  padding: 10px 10px 12px;
}
.pda-book-info strong, .pda-video-info strong {
  display: block;
  font-size: 0.8rem;
  color: var(--chalk);
  margin-bottom: 2px;
  line-height: 1.3;
}
.pda-book-info span, .pda-video-info span {
  font-size: 0.7rem;
  color: var(--chalk-faint);
}
.pda-mini-btn {
  margin-top: 8px;
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--chalk);
  font-size: 0.7rem;
  padding: 7px;
  border-radius: 7px;
  cursor: pointer;
}
.pda-mini-btn:hover { border-color: var(--gold); color: var(--gold); }
.pda-mini-btn.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.pda-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.pda-table th {
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.64rem;
  color: var(--chalk-faint);
  text-transform: uppercase;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.pda-table td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--chalk-dim);
}
.pda-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  padding: 3px 8px;
  border-radius: 20px;
}
.pda-status.ok { color: var(--teal); border: 1px solid var(--teal); }
.pda-status.warn { color: var(--brick); border: 1px solid var(--brick); }

.pda-list-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.pda-list-card strong { display: block; font-size: 0.86rem; color: var(--chalk); }
.pda-list-card span { font-size: 0.72rem; color: var(--chalk-faint); }

.pda-chat-window {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pda-chat-msg {
  max-width: 76%;
  padding: 9px 12px;
  border-radius: 12px;
  font-size: 0.82rem;
  line-height: 1.4;
}
.pda-chat-msg.them {
  background: var(--panel);
  color: var(--chalk-dim);
  align-self: flex-start;
  border-bottom-left-radius: 3px;
}
.pda-chat-msg.me {
  background: var(--gold-dim);
  color: var(--chalk);
  align-self: flex-end;
  border-bottom-right-radius: 3px;
}
.pda-chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.pda-chat-input-row input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 9px 14px;
  color: var(--chalk-dim);
  font-size: 0.82rem;
}

.pda-profile-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
.pda-profile-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.85rem;
}
.pda-profile-row:last-child { border-bottom: none; }
.pda-profile-row span:first-child { color: var(--chalk-faint); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }
.pda-profile-row span:last-child { color: var(--chalk); }

.pda-toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.pda-toggle-row:last-child { border-bottom: none; }
.pda-toggle-row span { font-size: 0.86rem; color: var(--chalk); }
.pda-toggle {
  width: 38px;
  height: 22px;
  border-radius: 20px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  position: relative;
  cursor: pointer;
}
.pda-toggle.on { background: var(--gold-dim); border-color: var(--gold); }
.pda-toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--chalk);
  transition: left 0.15s ease;
}
.pda-toggle.on::after { left: 18px; background: var(--gold); }

.pda-lock-note {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.76rem;
  color: var(--chalk-faint);
  margin-top: 16px;
}

@media (min-width: 560px) {
  .pda-card-grid { grid-template-columns: repeat(3, 1fr); }
}


/* =========================================================
   RESPONSIVO — telemóvel (padrão), tablet e desktop
========================================================= */

#root {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--void, #0e1c16);
}

body {
  margin: 0;
  background: #0e1c16;
}

@media (min-width: 720px) {
  body { background: #060b08; padding: 28px 0; }
  #root {
    max-width: 720px;
    min-height: calc(100vh - 56px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
  }
  .pda-card-grid { grid-template-columns: repeat(3, 1fr); }
  .pda-login .pda-roles { max-width: 480px; }
}

@media (min-width: 1080px) {
  #root {
    max-width: 1120px;
  }

  #root.pda-screen-app .pda-app {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
  }
  #root.pda-screen-app .pda-topbar {
    grid-column: 1 / -1;
    position: static;
  }
  #root.pda-screen-app .pda-drawer {
    position: sticky;
    top: 0;
    transform: none !important;
    grid-column: 1;
    grid-row: 2;
    height: calc(100vh - 61px);
    border-right: 1px solid var(--line);
  }
  #root.pda-screen-app .pda-drawer-overlay { display: none !important; }
  #root.pda-screen-app .pda-main {
    grid-column: 2;
    grid-row: 2;
    max-width: 760px;
    width: 100%;
  }
  .pda-card-grid { grid-template-columns: repeat(4, 1fr); }
  .pda-icon-btn[data-action="toggle-drawer"] { display: none; }
}

@media (min-width: 720px) and (max-width: 1079px) {
  .pda-roles { max-width: 520px; }
}

</style>

  /* ---------------------------------------------------------

  --------------------------------------------------------- */

    var menu = MENUS[S.role] || MENUS.visitante;

            '<div class="pda-brand">' + esc(S.schoolName) + '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px">' +

          '<div class="pda-drawer-header" style="display:flex;justify-content:space-between;align-items:flex-start">' +
            '<div><div class="pda-hand">Menu</div><p>' + esc(S.displayName || ROLE_LABEL[S.role]) + '</p></div>' +

          '<div class="pda-drawer-footer"><button class="pda-drawer-item" data-action="logout">' + icon("logout", 17) + 'Terminar sessão</button></div>' +
        '</div>' +

        '<div class="pda-main">' + renderModule() + '</div>' +
      '</div>'
    );

  /* ---------------------------------------------------------
     Conteúdo de cada módulo
  --------------------------------------------------------- */
  function renderModule() {
    var m = S.activeModule;

    if (m === "feed") return feedHTML();
    if (m === "livraria") return libraryHTML("books", S.books, "PDF", "Descarregar PDF");
    if (m === "videoaulas") return videoHTML();
    if (m === "pautas") return pautasHTML();
    if (m === "plano") return planoHTML();
    if (m === "documentos") return documentosHTML();
    if (m === "matriculas") return simpleInfoHTML("Matrículas", "Consulta o período de matrícula e envia os teus dados diretamente à secretaria.", S.matriculas);
    if (m === "confirmacao") return simpleInfoHTML("Confirmação", "Confirma a tua vaga para o novo ano letivo antes do prazo da escola.", S.confirmacao);
    if (m === "mensalidades") return mensalidadesHTML();
    if (m === "chatgeral") return chatHTML(1, "Chat Geral");
    if (m === "chatturma") return chatHTML(2, "Chat da Turma");
    if (m === "chat_encarregados") return chatHTML(3, "Chat com Encarregados");
    if (m === "perfil") return perfilHTML();
    if (m === "definicoes") return definicoesHTML();

    if (m === "publicar_plano") return publishHTML(m, "Planos de aula", "Publica o plano da semana para as tuas turmas.", "Tópico da aula", "Descrição / objetivos");
    if (m === "publicar_aviso") return publishHTML(m, "Avisos", "Avisos aparecem no feed da escola.", "Título do aviso", "Mensagem");
    if (m === "publicar_material") return publishHTML(m, "Materiais", "Partilha resumos, fichas e exercícios com as turmas.", "Nome do material", "Notas para os alunos");
    if (m === "publicar_info") return publishHTML(m, "Informações", "Publica informações gerais para alunos e encarregados.", "Título", "Conteúdo");
    if (m === "publicar_documento") return publishHTML(m, "Publicar documentos", "Disponibiliza documentos oficiais da escola.", "Nome do documento", "Descrição");
    if (m === "publicar_comunicado") return publishHTML(m, "Comunicados", "Comunicados oficiais da direção, visíveis a toda a escola.", "Título do comunicado", "Mensagem");
    if (m === "publicar_reuniao") return publishHTML(m, "Reuniões", "Marca reuniões e avisa encarregados e professores.", "Assunto da reunião", "Data, hora e local");

    if (m === "presencas") return presencaHTML();
    if (m === "whatsapp") return whatsappHTML();
    if (m === "calendario") return calendarioHTML();
    if (m === "horarios") return horariosHTML();
    if (m === "avaliacoes") return manageListHTML("avaliacoes", "Avaliações", "Agenda testes e trabalhos por disciplina e turma.", "ex: Teste de Física — 12ª B, 20/08");
    if (m === "acompanhamento") return simpleInfoHTML("Acompanhamento académico", "Situação geral dos alunos por turma.", S.acompanhamento);

    if (m === "gerir_professores") return manageListHTML(m, "Professores", "Adiciona ou remove professores da escola.", "Nome do professor");
    if (m === "gerir_disciplinas") return manageListHTML(m, "Disciplinas", "Define as disciplinas lecionadas na escola.", "Nome da disciplina");
    if (m === "gerir_turmas") return manageListHTML(m, "Turmas", "Cria e organiza as turmas da escola.", "ex: 12ª B");
    if (m === "gerir_salas") return manageListHTML(m, "Salas", "Regista as salas disponíveis.", "ex: Sala 4");
    if (m === "gerir_periodos") return manageListHTML(m, "Períodos", "Define os períodos letivos.", "ex: Manhã");

  /* ---------------------------------------------------------
     Render + ligação com o DOM
  --------------------------------------------------------- */
  var root = document.getElementById("root");
  var lastKey = null;

  function render() {
    var key = S.screen + ":" + S.activeModule;
    var changedView = key !== lastKey;
    lastKey = key;

    root.className = "pda-root pda-screen-" + S.screen;
    var html;
    if (S.screen === "login") html = loginHTML();
    else if (S.screen === "visitorChoice") html = visitorChoiceHTML();
    else if (S.screen === "schoolPicker") html = schoolPickerHTML();
    else if (S.screen === "roleForm") html = roleFormHTML();
    else if (S.screen === "staffForm") html = staffFormHTML();
    else html = appShellHTML();
    root.innerHTML = html;

    if (changedView) window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------
     Ações (delegação de eventos — registadas uma única vez)
  --------------------------------------------------------- */
  var handlers = {
    "choose-role": function (el) {
      S.role = el.getAttribute("data-role");
      S.formError = "";
      if (S.role === "visitante") S.screen = "visitorChoice";
      else { S.authMode = "entrar"; S.screen = "roleForm"; }
      render();
    },
    "staff-access": function () { S.screen = "staffForm"; S.formError = ""; S.staffAuthMode = "entrar"; render(); },
    "back-login": function () { S.screen = "login"; render(); },
    "back-visitor-choice": function () { S.screen = "visitorChoice"; render(); },
    "goto-school-picker": function () { S.screen = "schoolPicker"; render(); },
    "pick-school": function (el) {
      S.schoolName = el.getAttribute("data-name");
      S.displayName = "Visitante";
      S.role = "visitante";
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "visitor-continue": function (el) {
      var withSchool = el.getAttribute("data-school") === "1";
      S.schoolName = withSchool ? "Colégio Nova Esperança" : "Portal do Aluno";
      S.displayName = "Visitante";
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "toggle-auth-mode": function (el) { S.authMode = el.getAttribute("data-mode"); render(); },
    "toggle-staff-auth-mode": function (el) { S.staffAuthMode = el.getAttribute("data-mode"); render(); },
    "toggle-drawer": function (el) { S.drawerOpen = el.getAttribute("data-open") === "1"; render(); },
    "set-module": function (el) { S.activeModule = el.getAttribute("data-module"); S.drawerOpen = false; render(); },
    "logout": function () {
      S.screen = "login"; S.role = null; S.drawerOpen = false; S.activeModule = "feed"; S.displayName = "";
      render();
    },
    "toggle-like": function (el) {
      var id = el.getAttribute("data-post");
      S.likes[id] = !S.likes[id];
      render();
    },
    "toggle-setting": function (el) {
      var key = el.getAttribute("data-key");
      S.settings[key] = !S.settings[key];
      render();
    },
    "toggle-presence": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.presence[i].presente = !S.presence[i].presente;
      S.presenceSaved = false;
      render();
    },
    "save-presence": function () { S.presenceSaved = true; render(); },
    "manage-remove": function (el) {
      var key = el.getAttribute("data-key");
      var i = Number(el.getAttribute("data-index"));
      S.adminLists[key].splice(i, 1);
      render();
    },
    "noop": function () {}
  };

  var formHandlers = {
    "role-login": function (form) {
      var name = (form.nome && form.nome.value) || "";
      var colegio = (form.colegio && form.colegio.value) || "";
      S.formError = "";
      S.displayName = name || (S.role === "aluno" ? "Aluno" : "Encarregado");
      if (colegio) S.schoolName = colegio;
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "staff-login": function (form) {
      var cargo = (form.cargo && form.cargo.value) || "professor";
      var name = (form.nome && form.nome.value) || "";
      var colegio = (form.colegio && form.colegio.value) || "";
      S.role = cargo;
      S.displayName = name || ROLE_LABEL[cargo];
      if (colegio) S.schoolName = colegio;
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "chat": function (form) {
      var channel = form.getAttribute("data-channel");
      var text = form.body.value.trim();
      if (!text) return;
      if (!S.chat[channel]) S.chat[channel] = [];
      S.chat[channel].push({ id: "m" + Date.now(), body: text, mine: true });
      render();
    },
    "publish": function (form) {
      var key = form.getAttribute("data-key");
      var t = form.t.value.trim();
      var b = form.b.value.trim();
      if (!t) return;
      if (!S.publishedByModule[key]) S.publishedByModule[key] = [];
      S.publishedByModule[key].unshift({ id: Date.now(), t: t, b: b, time: "agora mesmo" });
      render();
    },
    "manage-add": function (form) {
      var key = form.getAttribute("data-key");
      var val = form.val.value.trim();
      if (!val) return;
      if (!S.adminLists[key]) S.adminLists[key] = [];
      S.adminLists[key].push(val);
      render();
    },
    "whatsapp": function (form) {
      S.whatsapp = form.numero.value;
      S.whatsappSaved = true;
      render();
    }
  };

  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (handlers[action]) handlers[action](el, e);
  });

  root.addEventListener("input", function (e) {
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute("data-live-filter") === "schools") {
      var container = root.querySelector("#school-results");
      if (container) container.innerHTML = schoolResultsHTML(el.value);
    }
  });

  root.addEventListener("submit", function (e) {
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var type = form.getAttribute("data-form");
    if (formHandlers[type]) formHandlers[type](form, e);
  });

  render();
})();

</script>
</body>
</html>
